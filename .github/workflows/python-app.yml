# This workflow 

name: Python CI  # workflow name

# Trigger the workflow on any push, pull,merge, delete events to the main branch or request 
on:
  push:
    branches: 
        - main
  pull_request:
    branches:             # main, stages, production
        - main   


jobs:   # jobs = build, test etc.,
  test:

    runs-on: ubuntu-latest  # windows , mac-os   are containers to run code

    steps:                  
    # Step 1:  Checkout code form repository 
    
    - name: Check out code
      uses: actions/check out@v2


    # Step 2:  Checkout code form repository 
    - name: Set up Python
      uses: actions/Set up Python@v3
      with:
        python-version: "3.10"
    # Step 3:  Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Step 4:  Run test
   
    - name: Run test
      run: pytest

